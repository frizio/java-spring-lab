spring:
  datasource:
    url: jdbc:h2:mem:java_spring_lab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false
management:
  health:
    rabbit:
      enabled: false
